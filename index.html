<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מתכנן המטבח – משפחת עובדיה</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23b5532c'/><rect x='6' y='14' width='20' height='12' fill='%23fff'/><rect x='6' y='6' width='20' height='6' fill='%23fff' opacity='.7'/></svg>">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }</script>
</head>
<body data-tab="plan">
<header class="top">
  <div class="brand"><b>מתכנן המטבח</b><span>משפחת עובדיה · אופציה ב׳</span></div>
  <div class="tools">
    <a href="arch.html" id="archLink" title="תכנון אדריכלי של כל הדירה: העלאת תוכנית, חדרים והעמדת ריהוט" style="display:inline-flex;align-items:center;padding:6px 10px;border:1px solid #2f5d50;border-radius:8px;color:#2f5d50;text-decoration:none;font-weight:600;white-space:nowrap">🏠 תכנון הדירה</a>
    <button id="undo" title="ביטול (Ctrl+Z)">↶</button>
    <button id="redo" title="חזרה (Ctrl+Y)">↷</button>
    <label class="sel"><span>חזיתות</span><select id="pal"></select></label>
    <label class="sel"><span>משטח</span><select id="top"></select></label>
    <div class="menuw"><button id="menuBtn" title="עוד">⋯</button>
      <div id="menu">
        <button id="mExport">⬇ שמירת קובץ תכנון (JSON)</button>
        <button id="mImport">⬆ טעינת קובץ תכנון</button>
        <button id="mPrint">🖨 הדפסה / PDF</button>
        <button id="mReset" class="danger">⟲ חזרה לתכנון המקורי</button>
      </div>
    </div>
  </div>
</header>
<nav class="tabs">
  <button data-tab="plan">תוכנית</button>
  <button data-tab="elev">חזיתות</button>
  <button data-tab="3d">תלת־ממד</button>
  <button data-tab="list">רשימות</button>
</nav>
<div class="layout">
  <aside id="catalog"></aside>
  <main id="stage">
    <section id="v-plan" class="view">
      <div class="vbar">
        <div class="seg" id="planLayer"><button data-v="low">תחתונים וגבוהים</button><button data-v="up">עליונים</button></div>
        <label class="chk"><input type="checkbox" id="zonesT"> בשרי/חלבי</label>
      </div>
      <div id="planBox" class="canvasBox"></div>
    </section>
    <section id="v-elev" class="view">
      <div class="vbar">
        <div class="seg" id="elevWall"><button data-v="all">הכול</button><button data-v="A">מקרר</button><button data-v="B">כיריים</button><button data-v="C">חלון</button><button data-v="P">חצי האי</button></div>
        <label class="chk"><input type="checkbox" id="ptsT"> נקודות חשמל/מים</label>
      </div>
      <div id="elevBox"></div>
    </section>
    <section id="v-3d" class="view">
      <div class="vbar">
        <div class="seg" id="mode3d"><button data-v="simple">פשוט</button><button data-v="real">ריאליסטי</button></div>
        <div class="seg" id="cam3d"><button data-v="iso">מבט כללי</button><button data-v="top">מלמעלה</button><button data-v="front">מול</button><button data-v="eye">גובה עיניים</button></div>
        <div class="seg" id="qual3d"><button data-v="low">איכות רגילה</button><button data-v="high">איכות גבוהה</button></div>
        <label class="chk"><input type="checkbox" id="lab3d"> תוויות</label>
        <button id="shot3d" class="btn">📷 שמירת תמונה</button>
      </div>
      <div id="threeBox"></div>
      <div id="walkPad">
        <button data-h='{"fw":1,"tr":0}'>▲</button>
        <div><button data-h='{"fw":0,"tr":1}'>⟲</button><button data-h='{"fw":-1,"tr":0}'>▼</button><button data-h='{"fw":0,"tr":-1}'>⟳</button></div>
      </div>
      <p class="hint h3d">גרירה = סיבוב, צביטה/גלגלת = זום, שתי אצבעות = הזזה. בגובה עיניים: גרירה להסתכלות, חיצים או W/A/S/D להליכה. לחיצה על ארון בוחרת אותו.</p>
    </section>
    <section id="v-list" class="view">
      <div class="vbar"><button id="printBtn" class="btn">🖨 הדפסה / שמירה כ-PDF</button></div>
      <div id="listBox"></div>
    </section>
    <div id="warnings"></div>
  </main>
  <aside id="inspector"></aside>
</div>
<button id="fabAdd">＋ הוספת ארון / מכשיר</button>
<div id="dragInfo"></div>
<div id="flash"></div>
<span id="tabWarn" hidden></span>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<div id="printBox"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
